services:
  - type: web
    name: camera-capture
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: CAPTURE_STORAGE_DIR
        value: /tmp/captures
      - key: PYTHON_VERSION
        value: 3.12.11
