<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Pop — Gallery</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;--bg:#0f1419;--card:#1a222d;--muted:#9aa8bc;--text:#eef2f8}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);padding:20px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
button{padding:10px 14px;border:0;border-radius:10px;background:#7c9cff;color:#0b1020;font-weight:700;cursor:pointer;margin-bottom:14px}
#msg{color:var(--muted);margin-bottom:14px;min-height:1.2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--card);border:1px solid #2e3a4d;border-radius:12px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#080a0d}
.meta{padding:8px 10px;font-size:.75rem;color:var(--muted)}
.meta a{color:#9eb4ff}
</style>
</head>
<body>
<div class="wrap">
<h1>Gallery</h1>
<p class="sub">All images stored on this server.</p>
<button type="button" id="refreshBtn">Refresh</button>
<p id="msg"></p>
<div id="grid" class="grid"></div>
</div>
<script>
const refreshBtn=document.querySelector("#refreshBtn");
const grid=document.querySelector("#grid");
const msg=document.querySelector("#msg");
function say(t){msg.textContent=t}

async function loadGallery(){
  grid.innerHTML="";
  say("Loading…");
  try{
    const listRes=await fetch("/api/captures",{credentials:"same-origin"});
    const list=await listRes.json().catch(()=>({}));
    if(!listRes.ok)throw new Error(list.detail||"Could not load list.");
    const items=list.captures||[];
    if(!items.length){say("No images on this server right now.");return}
    say(`${items.length} image(s)`);
    for(const item of items){
      const card=document.createElement("article");
      card.className="card";
      const img=document.createElement("img");
      img.alt=item.capture_id;
      img.loading="lazy";
      img.src=`/api/captures/${item.capture_id}/image`;
      const meta=document.createElement("div");
      meta.className="meta";
      meta.innerHTML=`<div>${item.modified_utc.replace("T"," ").replace("+00:00"," UTC")}</div>
        <div><a href="/api/captures/${item.capture_id}/download" download="${item.capture_id}.jpg">Download</a></div>`;
      card.append(img,meta);
      grid.append(card);
    }
  }catch(e){say(e.message||"Failed.");}
}

refreshBtn.addEventListener("click",loadGallery);
loadGallery();
</script>
</body>
</html>
