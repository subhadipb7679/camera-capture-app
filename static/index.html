<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Camera capture</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101318;color:#f4f6fa;padding:16px;box-sizing:border-box}
main{width:min(92vw,640px)}video{width:100%;border-radius:12px;background:#080a0d;display:block}
#status{margin-top:12px;min-height:1.5em;overflow-wrap:anywhere;color:#c4cad4}
</style>
</head>
<body>
<main>
<video id="video" autoplay playsinline muted></video>
<p id="status" role="status" aria-live="polite">Starting camera…</p>
</main>
<script>
const video=document.querySelector("#video");
const statusEl=document.querySelector("#status");
let stream=null;
function status(s){statusEl.textContent=s}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
async function runCapture(){
  if(!navigator.mediaDevices?.getUserMedia){status("Camera access requires HTTPS or localhost.");return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}});
    video.srcObject=stream;await video.play();
    status("Camera ready. Capturing shortly…");
    await new Promise(resolve=>setTimeout(resolve,1200));
    if(!stream||!video.videoWidth)throw new Error("Camera preview did not initialize.");
    const canvas=document.createElement("canvas");canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    const ctx=canvas.getContext("2d");ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.9));
    stopCamera();
    if(!blob)throw new Error("Could not capture image.");
    const form=new FormData();form.append("image",blob,"capture.jpg");
    status("Saving…");
    const response=await fetch("/api/capture",{method:"POST",body:form,credentials:"same-origin"});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.detail||"Save failed.");
    status("Done. Reference: "+result.capture_id);
  }catch(e){
    stopCamera();status(e.message||"Capture failed.");
  }
}
runCapture();
window.addEventListener("pagehide",stopCamera);
</script>
</body>
</html>
